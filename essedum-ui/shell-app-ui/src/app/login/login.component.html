<div class="lfx-l-mainwrapper--login" [class.login-dark]="isDark" [class.login-light]="!isDark">

  <!-- Theme toggle — top right -->
  <button class="login-theme-toggle" (click)="toggleTheme()">
    <span class="theme-toggle-icon">{{ isDark ? '🌙' : '☀️' }}</span>
    <span class="theme-toggle-label">{{ isDark ? 'Dark' : 'Light' }}</span>
  </button>

  <div class="lfx-l-pageoverlay">
    <div class="lfx-l-login-mid">

      <!-- Logo section -->
      <div class="login-logo-area">
        <div class="login-logo-icon-wrap">
          <img src="assets/img/essedum_icon_small.png" alt="ESSEDUM" class="login-essedum-icon" />
        </div>
        <div class="logo-common">ESSEDUM</div>
      </div>

      <!-- Login card -->
      <div class="lfx-l-login-ctr">
        <h2 class="login-card-title">Log In</h2>

        <div *ngIf="userUnauthorizedAlert" class="login-error-msg">
          <i class="fa fa-exclamation-circle" aria-hidden="true"></i>
          {{ userUnauthorizedMsg }}
        </div>

        <mat-tab-group #tabGroup class="login-tab-group">

          <mat-tab label="Login As Guest User">
            <div class="login-tab-content login-tab-content--guest">
              <button mat-raised-button class="login-cta-btn" [disabled]="false" (click)="loginAsGuest()">
                Login as Guest User
              </button>
            </div>
          </mat-tab>

          <mat-tab label="Login with Credentials">
            <div class="login-tab-content">
              <mat-form-field appearance="outline" class="login-field" floatLabel="always">
                <mat-label>Username</mat-label>
                <input matInput placeholder="Enter username..." [(ngModel)]="username" required class="lfx-fs-12" />
                <mat-error *ngIf="!username">Username is required</mat-error>
              </mat-form-field>

              <mat-form-field appearance="outline" class="login-field" floatLabel="always">
                <mat-label>Password</mat-label>
                <input matInput placeholder="Enter password..." type="password" [(ngModel)]="psd" required class="lfx-fs-12" />
                <mat-error *ngIf="!psd">Password is required</mat-error>
              </mat-form-field>

              <div *ngIf="errorAlert" class="login-error-msg">
                <i class="fa fa-exclamation-circle" aria-hidden="true"></i>
                {{ alertMsg }}
              </div>

              <button mat-raised-button class="login-cta-btn" [disabled]="false" (click)="dbAuthenticate()">
                Log In
              </button>
            </div>
          </mat-tab>

        </mat-tab-group>
      </div>

    </div>
  </div>

  <!-- Rendered here so Angular includes it in the DOM; CSS makes it position:fixed at bottom -->
  <app-footer></app-footer>
</div>
