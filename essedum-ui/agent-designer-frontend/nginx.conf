server {
    listen 3030;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → backend
    location /api/ {
        proxy_pass http://100.78.49.138/apps/agent-designer-backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host 100.78.49.138;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Proxy /health → backend
    location /health {
        proxy_pass http://100.78.49.138/apps/agent-designer-backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host 100.78.49.138;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve SPA — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
